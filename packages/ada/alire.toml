name = "uarp_sdk"
description = "Ada client for the UARP (Snaga) Universal Agent Runtime Platform API"
version = "0.5.10"
licenses = "MIT"
authors = ["Snaga"]
maintainers = ["Snaga <support@snaga.ai>"]
maintainers-logins = ["snaga-ai", "chabanov"]
website = "https://snaga.ai"
tags = ["api", "http", "client", "ai", "agents", "openapi"]

[[depends-on]]
#  GNATCOLL.JSON only, and through a SINGLE `with` in the whole crate
#  (`uarp-json_support.ads:7`, renamed there and used via that name).  The caret on
#  26 described the version this was BUILT on, not the version it needs,
#  and it made the crate uninstallable beside AWS 25.2, whose own
#  dependency is `gnatcoll~25.0.0` -- Alire reports the pair as
#  `missing:conflict` and refuses the solution outright.  Verified by
#  building this crate against gnatcoll 25.0.0: clean, no warnings.
gnatcoll = ">=25.0.0 & <27.0.0"

#  libcurl is linked through `-lcurl` (see uarp_sdk.gpr). It ships with macOS
#  and every mainstream Linux distribution; Alire's `libcurl` external is not
#  declared here because its detection only covers Linux package managers.

[gpr-externals]
UARP_SDK_LIBRARY_TYPE = ["relocatable", "static", "static-pic"]
