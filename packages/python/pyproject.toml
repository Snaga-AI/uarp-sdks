[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "uarp-sdk"
version = "0.13.1"
description = "Python client for the UARP (Snaga) Universal Agent Runtime Platform API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Snaga" }]
keywords = ["uarp", "snaga", "ai", "agents", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://snaga.ai"
Documentation = "https://dev.snaga.ai"
Repository = "https://github.com/Snaga-AI/uarp-sdks"
Changelog = "https://github.com/Snaga-AI/uarp-sdks/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/uarp_sdk"]

[tool.hatch.build.targets.sdist]
include = ["src/uarp_sdk", "tests", "README.md", "LICENSE", "pyproject.toml"]

# The SSE fixture every SDK of the family replays lives at the repository root,
# outside this project; without it two tests of the published sdist cannot run.
[tool.hatch.build.targets.sdist.force-include]
"../../contract/sse-fixtures/mixed.txt" = "tests/sse-fixtures/mixed.txt"
"../../contract/sse-fixtures/mixed.expected.json" = "tests/sse-fixtures/mixed.expected.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["uarp_sdk"]
mypy_path = "src"
