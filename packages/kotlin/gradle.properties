# The Kotlin compile daemon needs an explicit heap, and this file exists
# because it ran out of one.
#
# `Models.kt` is generated from the platform document and grew 12471 -> 16887
# lines when the vendored spec was refreshed to 641 operations (945 named
# types). That crossed whatever the daemon defaults to on a GitHub runner:
#
#     > Task :uarp-sdk:compileKotlin FAILED
#       Not enough memory to run compilation. Try to increase it via
#       'gradle.properties': kotlin.daemon.jvmargs=-Xmx<size>
#
# The failure is worth spelling out because of how it presented. The SAME
# commit compiled on one run and died on the next — a limit reached from
# below does not fail consistently, it fails as a flake, and the natural
# reading of a flake is "retry it". The retry passes often enough to keep
# the real cause hidden until the file grows a little more.
#
# The document only ever grows, so the default was never going to hold.
# `ubuntu-latest` gives 16 GB; 3 GB for the daemon and 2 GB for Gradle's own
# JVM leaves the rest alone and is far enough above today's need that the
# next refresh does not land here again.
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.jvmargs=-Xmx2g
