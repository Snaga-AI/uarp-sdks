name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without publishing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag and VERSION must agree
        run: |
          version="$(cat VERSION)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ($version). Run scripts/set-version.sh."
            exit 1
          fi
      - name: CHANGELOG must mention this version
        run: grep -q "## ${{ steps.version.outputs.value }}" CHANGELOG.md

  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
      - name: Publish
        if: env.DRY_RUN != 'true'
        run: npm publish --provenance --access public
        working-directory: packages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Pack only (dry run)
        if: env.DRY_RUN == 'true'
        run: npm pack
        working-directory: packages/typescript

  crates:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
        working-directory: packages/rust
      - name: Publish
        if: env.DRY_RUN != 'true'
        run: cargo publish --token "$CARGO_TOKEN"
        working-directory: packages/rust
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Package only (dry run)
        if: env.DRY_RUN == 'true'
        run: cargo package --allow-dirty
        working-directory: packages/rust

  maven:
    name: Maven Central
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :uarp-sdk:build
        working-directory: packages/kotlin
      - name: Publish
        if: env.DRY_RUN != 'true'
        run: ./gradlew :uarp-sdk:publish
        working-directory: packages/kotlin
        env:
          ORG_GRADLE_PROJECT_mavenUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenPassword: ${{ secrets.MAVEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      - name: Publish locally (dry run)
        if: env.DRY_RUN == 'true'
        run: ./gradlew :uarp-sdk:publishToMavenLocal
        working-directory: packages/kotlin

  swift:
    name: SwiftPM
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # SwiftPM resolves from git tags, so the tag itself is the release.
      # This job exists to prove the tagged commit builds.
      - run: swift build
        working-directory: packages/swift
      - run: swift test
        working-directory: packages/swift

  swift-mirror:
    name: SwiftPM mirror
    needs: [verify, swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SwiftPM has no notion of a package inside a subdirectory: it resolves a
      # git URL and expects Package.swift at the root. A consumer therefore
      # cannot depend on this monorepo at all, so the tagged package is copied
      # into snaga-ai/uarp-swift, which exists only to be depended upon.
      #
      # The mirror is cloned rather than recreated: its tags are the released
      # versions, and dropping them would break everyone already pinned to one.
      - name: Copy the package into the mirror
        env:
          TOKEN: ${{ secrets.SWIFT_MIRROR_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${TOKEN}@github.com/snaga-ai/uarp-swift.git"
          git clone --quiet "$remote" mirror || { mkdir mirror && git -C mirror init --quiet -b main; }

          # Everything except the mirror's own git metadata is replaced, so a
          # file deleted upstream also disappears here.
          find mirror -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R packages/swift/. mirror/
          cp CHANGELOG.md mirror/

          cd mirror
          git config user.name "snaga-ai release"
          git config user.email "support@snaga.ai"
          git add -A
          # A tag with no file changes is still a release worth publishing.
          git diff --cached --quiet || git commit --quiet -m "uarp-sdk ${VERSION}"
          git tag "${VERSION}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run: would push ${VERSION} to snaga-ai/uarp-swift"
          else
            git push --quiet "$remote" HEAD:main
            git push --quiet "$remote" "${VERSION}"
          fi

  ada:
    name: Alire
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: alire-project/setup-alire@v4
        with:
          toolchain: gnat_native^15 gprbuild^26
      - run: ./tests/run-tests.sh
        working-directory: packages/ada
      # Alire releases go through a pull request against the community index,
      # so this only prepares the manifest; `alr publish` prints the next step.
      - name: Prepare the Alire submission
        run: alr publish --tar
        working-directory: packages/ada

  github-release:
    name: GitHub release
    needs: [verify, npm, crates, maven, swift, swift-mirror, ada]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract the changelog entry
        run: |
          awk '/^## ${{ needs.verify.outputs.version }}/{flag=1; next} /^## /{flag=0} flag' \
            CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          name: v${{ needs.verify.outputs.version }}
