name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without publishing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Tag and VERSION must agree
        run: |
          version="$(cat VERSION)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match VERSION ($version). Run scripts/set-version.sh."
            exit 1
          fi
      - name: CHANGELOG must mention this version
        run: grep -q "## ${{ steps.version.outputs.value }}" CHANGELOG.md

  npm:
    name: npm
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript
      # A release is re-run often enough — a later job fails, an account is
      # fixed — that "this version is already published" has to be an ordinary
      # outcome rather than a red build.
      - name: Publish
        if: env.DRY_RUN != 'true'
        working-directory: packages/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if output=$(npm publish --provenance --access public 2>&1); then
            echo "$output"
          else
            echo "$output"
            echo "$output" | grep -qiE "cannot publish over|EPUBLISHCONFLICT" || exit 1
            echo "::notice::uarp-sdk is already on npm at this version; nothing to do"
          fi
      - name: Pack only (dry run)
        if: env.DRY_RUN == 'true'
        run: npm pack
        working-directory: packages/typescript

  crates:
    name: crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features
        working-directory: packages/rust
      - name: Publish
        if: env.DRY_RUN != 'true'
        working-directory: packages/rust
        env:
          # `--token` is deprecated; cargo reads this variable instead.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if output=$(cargo publish 2>&1); then
            echo "$output"
          else
            echo "$output"
            echo "$output" | grep -qiE "already (been )?uploaded|already exists" || exit 1
            echo "::notice::uarp-sdk is already on crates.io at this version; nothing to do"
          fi
      - name: Package only (dry run)
        if: env.DRY_RUN == 'true'
        run: cargo package --allow-dirty
        working-directory: packages/rust

  maven:
    name: Maven Central
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :uarp-sdk:build
        working-directory: packages/kotlin
      # Central needs a verified namespace and a signing key. Until those exist
      # the release should still ship the other four packages rather than fail
      # as a whole — but it must say so, not skip in silence.
      - id: creds
        env:
          USERNAME: ${{ secrets.MAVEN_USERNAME }}
          SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
        run: |
          if [ -n "$USERNAME" ] && [ -n "$SIGNING_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Maven Central is not configured; see PUBLISHING.md. The jar was built but not published."
          fi
      - name: Stage the signed artifacts
        run: ./gradlew :uarp-sdk:publishMavenPublicationToStagingRepository
        working-directory: packages/kotlin
        env:
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      - name: Upload the bundle to Central
        if: env.DRY_RUN != 'true' && steps.creds.outputs.ready == 'true'
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: ./scripts/publish-maven.sh "${{ needs.verify.outputs.version }}"

  swift:
    name: SwiftPM
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # SwiftPM resolves from git tags, so the tag itself is the release.
      # This job exists to prove the tagged commit builds.
      - run: swift build
        working-directory: packages/swift
      - run: swift test
        working-directory: packages/swift

  swift-mirror:
    name: SwiftPM mirror
    needs: [verify, swift]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SwiftPM has no notion of a package inside a subdirectory: it resolves a
      # git URL and expects Package.swift at the root. A consumer therefore
      # cannot depend on this monorepo at all, so the tagged package is copied
      # into Snaga-AI/uarp-swift, which exists only to be depended upon.
      #
      # The mirror is cloned rather than recreated: its tags are the released
      # versions, and dropping them would break everyone already pinned to one.
      - name: Copy the package into the mirror
        env:
          TOKEN: ${{ secrets.SWIFT_MIRROR_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::warning::SWIFT_MIRROR_TOKEN is not set; Snaga-AI/uarp-swift was not updated. See PUBLISHING.md."
            exit 0
          fi
          remote="https://x-access-token:${TOKEN}@github.com/Snaga-AI/uarp-swift.git"
          git clone --quiet "$remote" mirror || { mkdir mirror && git -C mirror init --quiet -b main; }

          ./scripts/swift-mirror.sh mirror

          cd mirror
          git config user.name "snaga-ai release"
          git config user.email "support@snaga.ai"
          git add -A
          # A tag with no file changes is still a release worth publishing.
          git diff --cached --quiet || git commit --quiet -m "uarp-sdk ${VERSION}"
          git tag "${VERSION}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "dry run: would push ${VERSION} to Snaga-AI/uarp-swift"
          else
            git push --quiet "$remote" HEAD:main
            git push --quiet "$remote" "${VERSION}"
          fi

  ada:
    name: Alire
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: alire-project/setup-alire@v4
        with:
          # Without a version the action installs alr 2.0.2, whose pinned index
          # has no GNAT 15 at all, so the toolchain below cannot resolve.
          version: 2.1.1
          toolchain: gnat_native^15 gprbuild^26
      - run: ./tests/run-tests.sh
        working-directory: packages/ada
      # Alire has no upload: a release is a pull request against the community
      # index, pointing at a hosted tarball. `alr publish --tar` builds that
      # tarball and then asks, on stdin, where it will live — a question with
      # nobody to answer it here, which used to fail the job after the archive
      # had already been written. Feed it nothing and keep the archive.
      - name: Build the Alire submission tarball
        working-directory: packages/ada
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          alr -n publish --tar </dev/null || true
          archive="alire/archives/uarp_sdk-${VERSION}.tgz"
          test -f "$archive" || { echo "::error::alr did not produce $archive"; exit 1; }
          echo "built $archive"
      - uses: actions/upload-artifact@v4
        with:
          name: alire-tarball
          path: packages/ada/alire/archives/*.tgz
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [verify, npm, crates, maven, swift, swift-mirror, ada]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract the changelog entry
        run: |
          awk '/^## ${{ needs.verify.outputs.version }}/{flag=1; next} /^## /{flag=0} flag' \
            CHANGELOG.md > release-notes.md
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          name: v${{ needs.verify.outputs.version }}
