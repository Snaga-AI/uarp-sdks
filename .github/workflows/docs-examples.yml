name: Documentation examples

# No path filter: SDK, generator, dependency and documentation changes can all
# invalidate examples. Fork PRs need no secrets; requests stay on localhost.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-examples-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Docs examples (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: ts
            os: ubuntu-latest
          - language: python
            os: ubuntu-latest
          - language: rust
            os: ubuntu-latest
          - language: swift
            os: macos-15
          - language: kotlin
            os: ubuntu-latest
          - language: ada
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set report directory
        run: echo "DOCS_CHECK_DIR=$RUNNER_TEMP/docs-examples" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
      - uses: Swatinem/rust-cache@v2
        if: matrix.language == 'rust'
        with:
          workspaces: packages/rust
      - uses: astral-sh/setup-uv@v6
        if: matrix.language == 'python'
        with:
          python-version: '3.14'
      - uses: actions/setup-java@v4
        if: matrix.language == 'kotlin'
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        if: matrix.language == 'kotlin'
      - name: Install libcurl
        if: matrix.language == 'ada'
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: alire-project/setup-alire@v4
        if: matrix.language == 'ada'
        with:
          version: 2.1.1
          toolchain: gnat_native^15 gprbuild^26
      - name: Prepare Ada dependencies without compiling the SDK twice
        if: matrix.language == 'ada'
        working-directory: packages/ada
        run: alr -n build --profiles="*=development" --stop-after=pre-build
      # Last: other toolchain installers can replace Node on PATH.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/react-landing/package-lock.json
      - name: Install documentation dependencies
        run: npm ci
        working-directory: examples/react-landing
      - name: Install TypeScript SDK build dependencies
        if: matrix.language == 'ts'
        run: npm ci --prefix packages/typescript
      - name: Install Python SDK and type checker
        if: matrix.language == 'python'
        run: uv sync --project packages/python --group dev
      - name: Compile displayed samples and execute Quickstart
        working-directory: examples/react-landing
        shell: bash
        env:
          DOCS_LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCS_CHECK_DIR"
          npm run check:samples -- "$DOCS_LANGUAGE" 2>&1 | tee "$DOCS_CHECK_DIR/check.log"
      - name: Save sample inventory, results and compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-examples-${{ matrix.language }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ env.DOCS_CHECK_DIR }}/inventory.json
            ${{ env.DOCS_CHECK_DIR }}/results.json
            ${{ env.DOCS_CHECK_DIR }}/check.log
