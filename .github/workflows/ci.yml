name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generator:
    name: Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The fixture-compile tests need a Rust toolchain; without one they skip.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      # setup-node comes after every other toolchain action on purpose. Some of
      # them put their own Node on PATH — setup-alire left this job running
      # v20 despite asking for v24 — and whichever runs last wins.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix generator
      - name: Type-check the generator
        run: npx --prefix generator tsc -p generator/tsconfig.json
      - name: Unit, IR, golden and compile tests
        run: npm test --prefix generator
      - name: Checked-in output must match the emitters
        run: node generator/src/index.ts --check

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/typescript/package.json
      - run: npm install
        working-directory: packages/typescript
      - run: npm run typecheck
        working-directory: packages/typescript
      - run: npm test
        working-directory: packages/typescript

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/rust
      - run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: packages/rust
      - run: cargo test --all-features
        working-directory: packages/rust
      - run: cargo build --examples
        working-directory: packages/rust

  msrv:
    name: Rust MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Whatever the manifest promises is what gets checked, so the promise and
      # the check cannot drift apart. The floor is not ours alone: the resolved
      # dependency tree raises it, and this job is how that becomes visible
      # rather than becoming a user's build error.
      - id: msrv
        run: |
          version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' packages/rust/Cargo.toml | head -1)
          test -n "$version" || { echo "::error::packages/rust/Cargo.toml has no rust-version"; exit 1; }
          echo "checking against Rust $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - run: cargo check --all-features
        working-directory: packages/rust

  swift:
    name: Swift
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: swift build
        working-directory: packages/swift
      - run: swift test
        working-directory: packages/swift
      # The fixtures cover edge cases the production spec does not contain, and
      # Swift is the language most prone to shadowing. This runner already has
      # the toolchain, so the check rides along here rather than in its own job.
      - name: Compile the generator fixtures
        run: |
          npm install --prefix generator
          UARP_COMPILE_TARGETS=swift node --test generator/test/compile.test.ts

  kotlin:
    name: Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :uarp-sdk:build
        working-directory: packages/kotlin

  contract:
    name: Cross-SDK contract
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: alire-project/setup-alire@v4
        with:
          # Without a version the action installs alr 2.0.2, whose pinned index
          # has no GNAT 15 at all, so the toolchain below cannot resolve.
          version: 2.1.1
          toolchain: gnat_native^15 gprbuild^26
      # Alire's macOS GNAT carries fixincludes copies of the system headers,
      # made against a newer SDK than the runner has: the patched <stdio.h>
      # includes _bounds.h, which does not exist here, and every C compilation
      # dies on it. Both 15 and 16 are affected, so this is not a version to
      # pin around. Dropping the copies makes the compiler read the real SDK
      # headers, which is what they were meant to stand in for.
      - name: Drop GNAT's stale copies of the macOS system headers
        run: find "$HOME/.local/share/alire/toolchains" -type d -name include-fixed -prune -exec rm -rf {} +
      # setup-node comes after every other toolchain action on purpose. Some of
      # them put their own Node on PATH — setup-alire left this job running
      # v20 despite asking for v24 — and whichever runs last wins.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
        working-directory: packages/typescript
      # run.sh executes the TypeScript runner as a .ts file, so a Node that
      # strips types is not optional here.
      - run: node --version
      # Every SDK whose toolchain is present runs the same scenarios; the
      # script fails if their traffic differs.
      - run: ./contract/run.sh

  ada:
    name: Ada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - uses: alire-project/setup-alire@v4
        with:
          # Without a version the action installs alr 2.0.2, whose pinned index
          # has no GNAT 15 at all, so the toolchain below cannot resolve.
          version: 2.1.1
          toolchain: gnat_native^15 gprbuild^26
      - name: Build and test
        run: ./tests/run-tests.sh
        working-directory: packages/ada
      - name: Build the example
        run: alr -n build
        working-directory: packages/ada/examples
